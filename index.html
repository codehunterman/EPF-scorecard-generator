<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scorecard Maker</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;1,900&family=Barlow:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#111;--gold:#c9a227;--bg:#efede8;--line:#d8d4ca}
*{box-sizing:border-box}
body{margin:0;font:500 16px/1.4 Barlow,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--ink);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:4px solid var(--gold)}
header b{font:italic 900 22px 'Barlow Condensed',Impact,sans-serif;letter-spacing:1px}
nav button{background:none;border:0;color:#bbb;font:inherit;padding:6px 10px;cursor:pointer}
nav button.on{color:var(--gold);font-weight:700}
main{max-width:720px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--line);padding:14px;margin-bottom:14px}
h3{margin:0 0 10px;font:italic 900 20px 'Barlow Condensed',Impact,sans-serif}
label{display:block;font-size:13px;font-weight:700;margin:8px 0 3px}
input,select{width:100%;padding:10px;border:1px solid #bbb;font:inherit;background:#fff;border-radius:0}
.scores{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn,button.p{background:var(--ink);color:#fff;border:0;padding:11px 14px;font:700 15px Barlow,sans-serif;cursor:pointer;display:inline-block}
.btn.g,button.g{background:var(--gold);color:#111}
button.x{background:none;border:1px solid #bbb;padding:6px 10px;cursor:pointer}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.row img{width:44px;height:44px;object-fit:cover;background:#ddd}
.row input{flex:1;min-width:0}
canvas{width:100%;height:auto;display:block;border:1px solid var(--line);background:#fff}
.hide{display:none}
.note{font-size:13px;color:#555}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
</style></head>
<body>
<header><b>SCORECARD MAKER</b><nav><button id="n1" class="on" onclick="tab(1)">Create</button><button id="n2" onclick="tab(2)">Admin</button></nav></header>
<main>
<section id="t1">
  <div class="card">
    <label>Tournament</label><select id="sT" onchange="render()"></select>
    <label>Team 1</label><select id="sA" onchange="render()"></select>
    <label>Team 2</label><select id="sB" onchange="render()"></select>
    <div class="scores"><div><label>Team 1 score</label><input id="nA" type="number" inputmode="numeric" min="0" value="0" oninput="render()"></div>
    <div><label>Team 2 score</label><input id="nB" type="number" inputmode="numeric" min="0" value="0" oninput="render()"></div></div>
  </div>
  <canvas id="cv" width="1080" height="1350"></canvas>
  <div class="acts"><button class="p g" onclick="dl()">Download image</button><button class="p" id="shBtn" onclick="sh()">Share</button></div>
  <p class="note" id="empty"></p>
</section>

<section id="t2" class="hide">
  <div id="login" class="card"><h3>Admin login</h3><input id="pw" type="password" placeholder="Password (default: admin)"><div class="acts"><button class="p" onclick="login()">Log in</button></div></div>
  <div id="panel" class="hide">
    <div class="card"><h3>Club</h3>
      <label>Club name</label><input id="cName" oninput="D.club.name=this.value;save()">
      <label>Logo (PNG/JPG)</label><div class="row"><img id="cLogo"><label class="btn" style="margin:0">Upload<input type="file" accept="image/*" hidden onchange="logo(this)"></label></div></div>
    <div class="card"><h3>Tournaments</h3><div id="tList"></div><button class="p" onclick="addT()">Add tournament</button></div>
    <div class="card"><h3>Teams</h3><div id="teamList"></div>
      <label>New team name</label><input id="ntName"><label>Team photo (both players)</label><input id="ntPhoto" type="file" accept="image/*">
      <div class="acts"><button class="p g" onclick="addTeam()">Add team</button></div></div>
    <div class="card"><h3>Publish &amp; backup</h3>
      <p class="note">Changes are saved in this browser only. To make them live for everyone, export data.json and upload it next to index.html on your host.</p>
      <div class="acts"><button class="p g" onclick="exp()">Export data.json</button><label class="btn" style="margin:0">Import<input type="file" accept=".json" hidden onchange="imp(this)"></label><button class="p" onclick="resetLocal()">Reset to published</button></div>
      <label>Change admin password</label><input id="np" type="password" placeholder="New password"><div class="acts"><button class="p" onclick="D.pass=np.value||D.pass;save();alert('Saved. Export data.json to publish.')">Update</button></div></div>
  </div>
</section>
</main>

<script>
const KEY='scorecard_data_v1';
let D={club:{name:'ELITE PLAYMAKERS FC',logo:''},tournaments:[{name:'EPF CO-OP 2 VS 2 TOURNAMENT',short:'EPF CO-OP TOURNAMENT'}],teams:[],pass:'admin'};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');

async function init(){
  let ok=false;
  try{const l=localStorage.getItem(KEY);if(l){D=JSON.parse(l);ok=true}}catch(e){}
  if(!ok){try{const r=await fetch('data.json',{cache:'no-store'});if(r.ok)D=await r.json()}catch(e){}}
  if(!navigator.canShare)$('shBtn').classList.add('hide');
  fill();render();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){alert('Storage full. Use smaller or fewer photos.')}fill();render()}
function tab(n){$('t1').classList.toggle('hide',n!=1);$('t2').classList.toggle('hide',n!=2);$('n1').classList.toggle('on',n==1);$('n2').classList.toggle('on',n==2)}

function fill(){
  const keep=[sT.value,sA.value,sB.value];
  sT.innerHTML=D.tournaments.map((t,i)=>`<option value="${i}">${esc(t.name)}</option>`).join('');
  const to=D.teams.map((t,i)=>`<option value="${i}">${esc(t.name)}</option>`).join('');
  sA.innerHTML=to;sB.innerHTML=to;
  if(keep[0]!=='')sT.value=keep[0];if(keep[1]!=='')sA.value=keep[1];
  sB.value=keep[2]!==''?keep[2]:(D.teams.length>1?1:0);
  $('empty').textContent=D.teams.length<2?'Add at least two teams in the Admin tab to create a scorecard.':'';
  if(!$('panel').classList.contains('hide'))adminDraw();
}

/* ---------- Admin ---------- */
function login(){if($('pw').value===D.pass){$('login').classList.add('hide');$('panel').classList.remove('hide');adminDraw()}else alert('Wrong password')}
function adminDraw(){
  $('cName').value=D.club.name;$('cLogo').src=D.club.logo||'data:,';
  $('tList').innerHTML=D.tournaments.map((t,i)=>`<div class="row"><input value="${esc(t.name)}" placeholder="Full name" onchange="D.tournaments[${i}].name=this.value;save()"><input value="${esc(t.short||'')}" placeholder="Footer text" onchange="D.tournaments[${i}].short=this.value;save()"><button class="x" onclick="del('tournaments',${i})">✕</button></div>`).join('');
  $('teamList').innerHTML=D.teams.map((t,i)=>`<div class="row"><img src="${t.photo||'data:,'}"><input value="${esc(t.name)}" onchange="D.teams[${i}].name=this.value;save()"><label class="btn" style="margin:0;padding:8px 10px">Photo<input type="file" accept="image/*" hidden onchange="repPhoto(${i},this)"></label><button class="x" onclick="del('teams',${i})">✕</button></div>`).join('')||'<p class="note">No teams yet.</p>';
}
function addT(){D.tournaments.push({name:'New tournament',short:'TOURNAMENT'});save()}
function del(k,i){if(confirm('Delete?')){D[k].splice(i,1);save()}}
async function addTeam(){
  const n=$('ntName').value.trim();if(!n)return alert('Enter a team name');
  const f=$('ntPhoto').files[0];
  D.teams.push({name:n,photo:f?await shrink(f,460,true):''});
  $('ntName').value='';$('ntPhoto').value='';save();
}
async function repPhoto(i,el){if(el.files[0]){D.teams[i].photo=await shrink(el.files[0],460,true);save()}}
async function logo(el){if(el.files[0]){D.club.logo=await shrink(el.files[0],300,false);save()}}
function shrink(file,w,gray){
  return new Promise(res=>{
    const im=new Image();im.onload=()=>{
      const s=Math.min(1,w/im.width),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;
      const x=c.getContext('2d');x.drawImage(im,0,0,c.width,c.height);
      if(gray){const d=x.getImageData(0,0,c.width,c.height),p=d.data;for(let i=0;i<p.length;i+=4){const g=.3*p[i]+.59*p[i+1]+.11*p[i+2];p[i]=p[i+1]=p[i+2]=g}x.putImageData(d,0,0)}
      res(gray?c.toDataURL('image/jpeg',.75):c.toDataURL('image/png'));
    };im.src=URL.createObjectURL(file);
  });
}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));a.download='data.json';a.click()}
function imp(el){const f=el.files[0];if(!f)return;f.text().then(t=>{try{D=JSON.parse(t);save()}catch(e){alert('Invalid file')}})}
function resetLocal(){if(confirm('Discard local edits and reload the published data?')){localStorage.removeItem(KEY);location.reload()}}

/* ---------- Scorecard drawing ---------- */
const F='"Barlow Condensed","Arial Narrow",Impact,sans-serif';
const loadImg=s=>new Promise(r=>{if(!s)return r(null);const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=s});
function spaced(x,t,cx,y,sp){let w=0;const ws=[...t].map(ch=>{const m=x.measureText(ch).width;w+=m;return m});w+=sp*(t.length-1);let p=cx-w/2;x.textAlign='left';[...t].forEach((ch,i)=>{x.fillText(ch,p,y);p+=ws[i]+sp})}
function fit(x,t,font,max,start,sp=0){let s=start;do{x.font=font(s);s-=2}while(s>20&&x.measureText(t).width+sp*t.length>max);return s+2}
function corner(x){x.fillStyle='#111';x.beginPath();x.moveTo(0,0);x.lineTo(240,0);x.lineTo(0,175);x.fill();x.strokeStyle='#c9a227';x.lineWidth=9;x.beginPath();x.moveTo(262,0);x.lineTo(0,192);x.stroke()}
async function photo(x,src,bx,by,bw,bh){
  const im=await loadImg(src);if(!im)return;
  const o=document.createElement('canvas');o.width=bw;o.height=bh;const q=o.getContext('2d');
  const s=Math.max(bw/im.width,bh/im.height),w=im.width*s,h=im.height*s;
  q.drawImage(im,(bw-w)/2,0,w,h);
  q.globalCompositeOperation='destination-out';
  const g=q.createLinearGradient(0,bh*.6,0,bh);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,1)');q.fillStyle=g;q.fillRect(0,0,bw,bh);
  x.drawImage(o,bx,by);
}
let busy=false,again=false;
async function render(){
  if(busy){again=true;return}busy=true;
  try{await Promise.all([document.fonts.load('italic 900 100px "Barlow Condensed"'),document.fonts.load('600 40px "Barlow Condensed"')])}catch(e){}
  const A=D.teams[sA.value]||{name:'TEAM 1'},B=D.teams[sB.value]||{name:'TEAM 2'},T=D.tournaments[sT.value]||{name:'TOURNAMENT',short:'TOURNAMENT'};
  const a=+nA.value||0,b=+nB.value||0,x=cv.getContext('2d'),G='#c9a227',K='#111';
  x.clearRect(0,0,1080,1350);x.fillStyle='#efede8';x.fillRect(0,0,1080,1350);
  corner(x);x.save();x.translate(1080,1350);x.rotate(Math.PI);corner(x);x.restore();
  x.textBaseline='alphabetic';
  // logo
  const lg=await loadImg(D.club.logo);
  if(lg){const s=Math.min(140/lg.width,140/lg.height);x.drawImage(lg,540-lg.width*s/2,55,lg.width*s,lg.height*s)}
  else{x.fillStyle=K;x.beginPath();x.arc(540,125,64,0,7);x.fill();x.strokeStyle=G;x.lineWidth=5;x.stroke();x.fillStyle=G;x.font=`italic 900 52px ${F}`;x.textAlign='center';x.fillText((D.club.name||'C').split(' ').map(w=>w[0]).join('').slice(0,3),540,143)}
  // club + lines
  x.fillStyle=K;x.font=`600 46px ${F}`;spaced(x,(D.club.name||'').toUpperCase(),540,262,12);
  x.fillRect(130,290,820,2);
  const ts=fit(x,T.name.toUpperCase(),s=>`600 ${s}px ${F}`,900,40,8);x.font=`600 ${ts}px ${F}`;spaced(x,T.name.toUpperCase(),540,350,8);
  // heading
  x.font=`italic 900 140px ${F}`;const w1=x.measureText('MATCH').width,w2=x.measureText('RESULT').width,gap=30,st=540-(w1+w2+gap)/2;
  x.textAlign='left';x.fillStyle=K;x.fillText('MATCH',st,480);x.fillStyle=G;x.fillText('RESULT',st+w1+gap,480);
  // photos
  await photo(x,A.photo,0,545,520,430);await photo(x,B.photo,560,545,520,430);
  // divider
  x.fillStyle=G;x.fillRect(539,575,3,95);x.fillRect(539,890,3,95);
  // scores
  x.fillStyle=K;x.textAlign='center';x.font=`italic 900 200px ${F}`;x.fillText(a,455,850);x.fillText(b,625,850);
  x.fillStyle=G;x.fillRect(521,775,38,10);
  // team names
  x.fillStyle=G;x.fillRect(70,992,380,3);x.fillRect(650,992,360,3);
  x.fillStyle=K;
  [[A.name,260],[B.name,830]].forEach(([n,cx])=>{n=n.toUpperCase();const sz=fit(x,n,s=>`600 ${s}px ${F}`,420,46,8);x.font=`600 ${sz}px ${F}`;spaced(x,n,cx,1045,8)});
  // winner
  const draw=a===b,lab=draw?'RESULT':'WINNER',wn=draw?'DRAW':(a>b?A.name:B.name).toUpperCase();
  x.fillStyle=K;x.font=`600 38px ${F}`;spaced(x,lab,540,1140,16);
  const lw=x.measureText(lab).width+16*lab.length;x.fillStyle=G;x.fillRect(90,1128,540-lw/2-90-25,3);x.fillRect(540+lw/2+25,1128,990-540-lw/2-25,3);
  x.fillStyle=K;const ws=fit(x,wn,s=>`italic 900 ${s}px ${F}`,840,120);x.font=`italic 900 ${ws}px ${F}`;x.textAlign='center';x.fillText(wn,540,1245);
  // footer
  x.font=`600 30px ${F}`;const ft=(T.short||T.name).toUpperCase();spaced(x,ft,540,1325,10);
  const fw=x.measureText(ft).width+10*ft.length;x.fillStyle=K;x.fillRect(100,1316,540-fw/2-100-25,2);x.fillRect(540+fw/2+25,1316,980-540-fw/2-25,2);
  busy=false;if(again){again=false;render()}
}
function blob(){return new Promise(r=>cv.toBlob(r,'image/png'))}
async function dl(){const b=await blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`${(D.teams[sA.value]||{}).name||'team1'}-vs-${(D.teams[sB.value]||{}).name||'team2'}.png`;a.click()}
async function sh(){const f=new File([await blob()],'scorecard.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f]}).catch(()=>{});else dl()}
init();
</script>
</body></html>
